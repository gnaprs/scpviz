name: Windows Py3.11

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"

jobs:
  build:
    uses: ./.github/workflows/python-package-template.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      os: windows-latest
      python: "3.11"
