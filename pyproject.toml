[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scpviz"
version = "1.0.0"
authors = [
  {name="Marion Pang", email="sr_pang@hotmail.com"},
]
description = "A package to visualize single cell proteomics (and more to come!) data"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "matplotlib>=3.5",
  "seaborn>=0.12",
  "upsetplot>=0.6",
  "scikit-learn>=1.0",
  "scipy>=1.7",
  "umap-learn>=0.5",
  "adjustText>=0.7",
  "anndata>=0.8",
  "requests>=2.27",
  "matplotlib_venn>=0.11",
  "pyarrow>=7.0",
  "scanpy>=1.9",
  "gseapy>=1.0",
  "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/gnaprs/scpviz"
Issues = "https://github.com/gnaprs/scpviz/issues"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
filterwarnings = [
    "ignore::DeprecationWarning:jupyter_client.connect",
    "ignore::DeprecationWarning:upsetplot.plotting"
]

[project.optional-dependencies]
sc = [
  "directlfq>=0.2",
  "pimms-learn>=0.5.2",
  "harmonypy==0.0.10",
  "leidenalg>=0.9",
  "igraph>=0.10",
  "scikit-misc>=0.2",
]
notebook = [
  "IPython>=7.31",
]
dev = ["pytest>=9.0.3","coverage>=7.13.5","flake8>=7.3.0","pytest-cov>=7.1.0"]

# MkDocs + mkdocstrings stack only (use a dedicated venv, e.g. venv-docs; includes editable scpviz for API autodoc).
# mkdocs-material>=9.7.5 requires MkDocs<2 so builds stay valid if MkDocs 2.0 ships (breaking theme/plugin API).
docs = [
  "mkdocs-material>=9.7.5",
  "mkdocstrings>=0.29.1,<0.31",
  "mkdocstrings-python>=1.16.2,<2",
  "mkdocs-literate-nav",
  "mkdocs-section-index",
  "pymdown-extensions",
  "black",
]
